name: Nix

# This build is required because Standards auto-merge waits only for required
# checks and `check` doesn't build this package, so a Dependabot update would
# otherwise land with a stale hash.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build pim
        run: nix build .#default -L

      - name: Check the binary and skills
        run: |
          result/bin/pim --help
          for skill in apps/cli/skills/*/SKILL.md; do
            cmp "$skill" "result/share/pim/skills/${skill#apps/cli/skills/}"
          done
